<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Observer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#080b14 url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80') center/cover no-repeat fixed;
  color:#d9e1f2;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:rgba(8,11,20,0.78);
  z-index:0;
}
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:36px 24px 60px;
  position:relative;
  z-index:1;
}
.top{
  text-align:center;
  margin-bottom:28px;
}
.greeting{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;
  color:#8895b3;
  font-style:italic;
  margin-bottom:14px;
}
.greeting span{
  color:#ece4cf;
  font-style:normal;
}
#clock{
  font-size:52px;
  font-weight:500;
  letter-spacing:1px;
  color:#ece4cf;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
#date{
  font-size:13px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#5c6b8c;
  margin-top:8px;
}
.search-box{
  margin:0 auto 22px;
  max-width:580px;
}
#search{
  width:100%;
  padding:14px 20px;
  border-radius:999px;
  border:1px solid rgba(140,163,204,0.2);
  background:rgba(20,28,51,0.55);
  color:#d9e1f2;
  font-size:15px;
  outline:none;
}
#search:focus{
  border-color:rgba(232,168,84,0.55);
}
.links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:14px;
  margin-bottom:36px;
}
.links a{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  border-radius:999px;
  border:1px solid rgba(140,163,204,0.16);
  background:rgba(20,28,51,0.4);
  color:#8895b3;
  text-decoration:none;
  font-size:13px;
}
.links a:hover{
  border-color:rgba(232,168,84,0.4);
  color:#ece4cf;
}
.links svg{
  width:16px;
  height:16px;
  flex-shrink:0;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.card{
  background:linear-gradient(180deg,rgba(20,28,51,0.75),rgba(14,20,36,0.75));
  border:1px solid rgba(140,163,204,0.14);
  border-radius:14px;
  padding:18px;
  backdrop-filter:blur(6px);
}
.card h2{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;
  color:#ece4cf;
  margin-bottom:14px;
  font-weight:600;
}
.apod-img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
  border:1px solid rgba(140,163,204,0.12);
  max-height:260px;
  object-fit:cover;
}
.apod-title{
  font-size:15px;
  color:#ece4cf;
  margin-bottom:4px;
}
.apod-text{
  font-size:13px;
  color:#8895b3;
  line-height:1.45;
}
#notes{
  width:100%;
  height:180px;
  background:rgba(8,11,20,0.6);
  border:1px solid rgba(140,163,204,0.16);
  border-radius:10px;
  color:#d9e1f2;
  padding:12px;
  resize:vertical;
  font-family:inherit;
  font-size:14px;
}
#notes:focus{outline:none;border-color:rgba(232,168,84,0.45)}
.settings{
  margin-top:18px;
}
.settings label{
  display:block;
  font-size:13px;
  color:#8895b3;
  margin-bottom:6px;
}
#nameInput{
  width:100%;
  padding:9px 12px;
  background:rgba(8,11,20,0.6);
  border:1px solid rgba(140,163,204,0.16);
  border-radius:8px;
  color:#d9e1f2;
  margin-bottom:12px;
}
#saveBtn{
  padding:8px 18px;
  background:#e8a854;
  color:#080b14;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
  font-size:13.5px;
}
#saveBtn:hover{background:#f0c060}
.small-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px;
}
.iss-val,.people-val{
  font-size:14px;
  color:#ece4cf;
  margin-top:6px;
  line-height:1.5;
}
.loading{color:#5c6b8c;font-size:14px}
@media(max-width:700px){
  .grid,.small-grid{grid-template-columns:1fr}
  #clock{font-size:42px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="greeting">Good evening, <span id="uname">Observer</span></div>
    <div id="clock">00:00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search the web...">
  </div>

  <div class="links" id="qlinks"></div>

  <div class="grid">
    <div class="card">
      <h2>Picture of the Day</h2>
      <div id="apod">
        <p class="loading">Loading NASA picture...</p>
      </div>
    </div>
    <div class="card">
      <h2>Field Notes</h2>
      <textarea id="notes" placeholder="Write something... saved automatically"></textarea>
    </div>
  </div>

  <div class="small-grid">
    <div class="card">
      <h2>ISS Position</h2>
      <div class="iss-val" id="iss">Fetching...</div>
    </div>
    <div class="card">
      <h2>People in Space</h2>
      <div class="people-val" id="people">Loading...</div>
    </div>
  </div>

  <div class="card settings">
    <h2>Settings</h2>
    <label>Your name</label>
    <input type="text" id="nameInput" placeholder="Observer">
    <button id="saveBtn">Save</button>
  </div>
</div>

<script>
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const unameEl = document.getElementById('uname');
const nameInput = document.getElementById('nameInput');
const notesEl = document.getElementById('notes');
const apodEl = document.getElementById('apod');
const issEl = document.getElementById('iss');
const peopleEl = document.getElementById('people');

function tick(){
  const n = new Date();
  clockEl.textContent = n.toLocaleTimeString('en-GB');
  dateEl.textContent = n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  let g = 'Good evening';
  const h = n.getHours();
  if(h < 12) g = 'Good morning';
  else if(h < 17) g = 'Good afternoon';
  document.querySelector('.greeting').childNodes[0].textContent = g + ', ';
}
setInterval(tick,1000);
tick();

const savedName = localStorage.getItem('obs-name');
if(savedName){
  unameEl.textContent = savedName;
  nameInput.value = savedName;
}
document.getElementById('saveBtn').onclick = ()=>{
  let v = nameInput.value.trim() || 'Observer';
  localStorage.setItem('obs-name',v);
  unameEl.textContent = v;
};

const savedNotes = localStorage.getItem('obs-notes');
if(savedNotes) notesEl.value = savedNotes;
notesEl.oninput = ()=>{
  localStorage.setItem('obs-notes',notesEl.value);
};

const links = [
  {
    n:'GitHub',
    u:'https://github.com',
    svg:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>'
  },
  {
    n:'Stardance',
    u:'https://stardance.hackclub.com',
    svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.3 7.2-6.3-4.8-6.3 4.8 2.3-7.2-6-4.8h7.6z"/></svg>'
  },
  {
    n:'YouTube',
    u:'https://youtube.com',
    svg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 00.5 6.2 31.5 31.5 0 000 12a31.5 31.5 0 00.5 5.8 3 3 0 002.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 002.1-2.1A31.5 31.5 0 0024 12a31.5 31.5 0 00-.5-5.8zM9.8 15.5v-7l6.2 3.5-6.2 3.5z"/></svg>'
  }
];
const ql = document.getElementById('qlinks');
links.forEach(l=>{
  const a = document.createElement('a');
  a.href = l.u;
  a.target = '_blank';
  a.innerHTML = l.svg + l.n;
  ql.appendChild(a);
});

document.getElementById('search').onkeydown = e=>{
  if(e.key === 'Enter'){
    const q = e.target.value.trim();
    if(q){
      window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
      e.target.value = '';
    }
  }
};

async function getApod(){
  try{
    const r = await fetch('https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY');
    const d = await r.json();
    if(d.media_type === 'image'){
      apodEl.innerHTML = `<img class="apod-img" src="${d.url}" alt="${d.title}"><div class="apod-title">${d.title}</div><div class="apod-text">${d.explanation.slice(0,200)}...</div>`;
    }else{
      apodEl.innerHTML = `<p>Today is a video. <a href="${d.url}" target="_blank" style="color:#e8a854">Open it</a></p>`;
    }
  }catch(e){
    apodEl.innerHTML = '<p class="loading">Couldnt load APOD right now</p>';
  }
}
getApod();

async function getIss(){
  try{
    const r = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
    const d = await r.json();
    issEl.innerHTML = `Lat ${d.latitude.toFixed(2)}° · Lon ${d.longitude.toFixed(2)}°<br>Alt ${d.altitude.toFixed(0)} km · ${d.velocity.toFixed(0)} km/h`;
  }catch(e){
    issEl.textContent = 'ISS data unavailable';
  }
}
getIss();
setInterval(getIss,20000);

async function getPeople(){
  try{
    const r = await fetch('http://api.open-notify.org/astros.json');
    const d = await r.json();
    peopleEl.innerHTML = `${d.number} humans currently in orbit`;
  }catch(e){
    peopleEl.textContent = 'Could not fetch crew info';
  }
}
getPeople();
</script>
</body>
</html>
