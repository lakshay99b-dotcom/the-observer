<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Observer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="greeting">Good evening, <span id="uname">Observer</span></div>
    <div id="clock">00:00:00</div>
    <div id="date"></div>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search the web...">
  </div>

  <div class="links" id="qlinks"></div>

  <div class="grid">
    <div class="card">
      <h2>Picture of the Day</h2>
      <div id="apod">
        <p class="loading">Loading NASA picture...</p>
      </div>
    </div>
    <div class="card">
      <h2>Field Notes</h2>
      <textarea id="notes" placeholder="Write something... saved automatically"></textarea>
    </div>
  </div>

  <div class="small-grid">
    <div class="card">
      <h2>ISS Position</h2>
      <div class="iss-val" id="iss">Fetching...</div>
    </div>
    <div class="card">
      <h2>People in Space</h2>
      <div class="people-val" id="people">Loading...</div>
    </div>
  </div>

  <div class="card settings">
    <h2>Settings</h2>
    <label>Your name</label>
    <input type="text" id="nameInput" placeholder="Observer">
    <button id="saveBtn">Save</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
